name: replay
description: RePlay - плеер и улучшение изображений.
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.0
  file_selector: ^1.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
